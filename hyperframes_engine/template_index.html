<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --caption-bg: {{ caption_bg }};
      --caption-primary: {{ caption_primary }};
      --caption-accent: {{ caption_accent }};
      --caption-stroke: {{ caption_stroke }};
      --cta-border: {{ cta_border }};
      --cta-accent: {{ cta_accent }};
      --caption-top: {{ caption_top }};
      --caption-size: {{ caption_size }};
      --cta-top: {{ cta_top }};
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #030e1a;
      font-family: "Outfit", sans-serif;
    }

    /* ── IMAGES ─────────────────────────────────────────────── */
    .scene-img {
      position: absolute;
      top: 0; left: 0;
      width: 1080px;
      height: 1920px;
      object-fit: cover;
      transform-origin: center center;
    }

    /* ── FLASH OVERLAY ──────────────────────────────────────── */
    #flash {
      position: absolute;
      top: 0; left: 0;
      width: 1080px;
      height: 1920px;
      background: #ffffff;
      opacity: 0;
      z-index: 50;
      pointer-events: none;
    }

    /* ── CAPTIONS ────────────────────────────────────────────── */
    .cap-word {
      position: absolute;
      left: 0;
      width: 1080px;
      top: var(--caption-top);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 60;
      opacity: 0;
      visibility: hidden;
    }
    .cap-inner {
      background: var(--caption-bg);
      border-radius: 12px;
      padding: 12px 28px;
      max-width: 920px;
      backdrop-filter: blur(3px);
    }
    .cap-text {
      font-family: "Manrope", "Outfit", sans-serif;
      font-weight: 800;
      font-size: var(--caption-size);
      color: var(--caption-primary);
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.95);
      -webkit-text-stroke: 1px var(--caption-stroke);
      text-align: center;
      line-height: 1.1;
      text-transform: uppercase;
      display: block;
    }
    .cap-text.gold  { color: var(--caption-accent); }
    .cap-text.price { color: var(--caption-accent); font-size: 88px; }
    .cap-text.white { color: #ffffff; }

    /* ── CTA OVERLAY ─────────────────────────────────────────── */
    #cta-overlay {
      position: absolute;
      left: 0;
      width: 1080px;
      top: var(--cta-top);
      display: flex;
      justify-content: center;
      z-index: 70;
      opacity: 0;
    }
    .cta-card {
      background: linear-gradient(135deg, rgba(10, 14, 26, 0.78), rgba(18, 26, 46, 0.72));
      border: 2px solid var(--cta-border);
      border-radius: 20px;
      padding: 24px 38px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      min-width: 720px;
      backdrop-filter: blur(5px);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.42);
    }
    .cta-head {
      font-family: "Manrope", "Outfit", sans-serif;
      font-weight: 700;
      font-size: 28px;
      color: #d7e7ff;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      opacity: 0.9;
      margin-bottom: 4px;
    }
    .cta-price {
      font-family: "Manrope", "Outfit", sans-serif;
      font-weight: 900;
      font-size: 74px;
      color: var(--cta-border);
      text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.9);
      line-height: 1.1;
    }
    .cta-location {
      font-family: "Manrope", "Outfit", sans-serif;
      font-weight: 600;
      font-size: 33px;
      color: #ffffff;
      text-shadow: 1px 1px 6px rgba(0, 0, 0, 0.9);
    }
    .cta-dm {
      font-family: "Manrope", "Outfit", sans-serif;
      font-weight: 700;
      font-size: 32px;
      color: var(--cta-accent);
      text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.9);
      margin-top: 6px;
      letter-spacing: 0.4px;
    }

    #final-fade {
      position: absolute;
      top: 0; left: 0;
      width: 1080px;
      height: 1920px;
      background: #000000;
      opacity: 0;
      z-index: 100;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div
  id="root"
  data-composition-id="real-estate-video"
  data-start="0"
  data-duration="{{ duration }}"
  data-width="1080"
  data-height="1920"
>

  <!-- ── IMAGES (slideshow) ──────────────────────────────────── -->
  {{ images_html }}

  <!-- ── AUDIO TRACKS ──────────────────────────── -->
  {{ music_html }}
  {{ vo_html }}
  {{ sfx_swoosh_html }}
  {{ sfx_impact_html }}

  <!-- ── SFX: CAMERA SHOTS at each cut ───────────────────────── -->
  {{ sfx_camera_html }}

  <!-- ── FLASH OVERLAY ─────────────────────── -->
  <div id="flash" data-layout-ignore></div>

  <!-- ── CAPTIONS ───────────────────────────────────── -->
  {{ captions_html }}

  <!-- ── CTA OVERLAY ────────────────────────── -->
  <div id="cta-overlay">
    <div class="cta-card">
      <div class="cta-head">Asesor comercial</div>
      <div class="cta-price">{{ price }}</div>
      <div class="cta-location">{{ location }}</div>
      <div class="cta-dm">{{ contact_cta }}</div>
    </div>
  </div>

  <div id="final-fade" data-layout-ignore></div>

</div>

<script>
  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });

  // ── KEN BURNS effect ────────────────────
  {{ ken_burns_js }}

  // ── FLASH CUTS ──────────────────────────────
  var cuts = [{{ cut_times }}];
  cuts.forEach(function (t) {
    tl.fromTo("#flash",
      { opacity: 0 },
      { opacity: 0.62, duration: 0.06, ease: "power2.in", overwrite: "auto" },
      t
    );
    tl.to("#flash", { opacity: 0, duration: 0.14, ease: "power3.out", overwrite: "auto" }, t + 0.06);
  });

  // ── WORD-BY-WORD CAPTIONS ─────────────────────────────────────
  var WORDS = [
    {{ words_js }}
  ];

  WORDS.forEach(function (w) {
    var id = w[0], start = w[1], end = w[2];
    var el = "#cg-" + id;
    var dur = Math.max(end - start, 0.2);
    var outEnd = start + dur;

    tl.set(el, { visibility: "visible", opacity: 0 }, start);

    if (dur >= 0.12) {
      tl.fromTo(el,
        { opacity: 0, scale: 0.82 },
        { opacity: 1, scale: 1, duration: 0.08, ease: "back.out(1.7)" },
        start
      );
    } else {
      tl.set(el, { opacity: 1, scale: 1 }, start);
    }

    if (dur >= 0.2) {
      tl.to(el, { opacity: 0, scale: 0.94, duration: 0.06, ease: "power2.in" }, outEnd - 0.06);
    }
    tl.set(el, { opacity: 0, visibility: "hidden" }, outEnd);
  });

  // ── CTA OVERLAY ─────────────────────
  tl.fromTo("#cta-overlay",
    { opacity: 0, y: 36 },
    { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
    {{ cta_start }}
  );

  tl.fromTo("#final-fade",
    { opacity: 0 },
    { opacity: 1, duration: 0.5, ease: "power2.inOut" },
    {{ duration }} - 0.5
  );

  window.__timelines["real-estate-video"] = tl;
</script>
</body>
</html>
