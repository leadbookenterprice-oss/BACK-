<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;600;700&family=Source+Sans+3:wght@300;400;600&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #101010; --fg: #f5f5f5; --accent: #e63946; }
  body { width: 1080px; height: 1350px; background: var(--bg); font-family: 'Source Sans 3', sans-serif; color: var(--fg); overflow: hidden; position: relative; }
  .bg-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
  .overlay { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(16,16,16,0.96) 0%, rgba(16,16,16,0.62) 42%, rgba(16,16,16,0.22) 100%); z-index: 2; }
  .content { position: absolute; inset: 0; z-index: 3; padding: 72px 68px 76px; display: flex; flex-direction: column; justify-content: space-between; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .logo { max-width: 230px; max-height: 90px; object-fit: contain; filter: brightness(0) invert(1); }
  .badge { background: var(--accent); color: #fff; font-family: 'Oswald', sans-serif; font-size: 20px; letter-spacing: 4px; padding: 10px 18px; text-transform: uppercase; }
  .middle { display: flex; flex-direction: column; gap: 22px; margin-bottom: 26px; }
  .headline { font-family: 'Oswald', sans-serif; font-size: 152px; font-weight: 700; line-height: 0.86; letter-spacing: 2px; text-transform: uppercase; color: var(--fg); }
  .subheadline { font-size: 45px; line-height: 1.25; color: rgba(255,255,255,0.92); max-width: 900px; }
  .footer { display: flex; justify-content: flex-end; }
  .footer-text { font-family: 'Oswald', sans-serif; font-size: 21px; color: rgba(255,255,255,0.58); letter-spacing: 3px; text-transform: uppercase; }
</style>
</head>
<body>
  {% if portada_url %}<img src="{{ portada_url }}" class="bg-image" />{% endif %}
  <div class="overlay"></div>
  <div class="content">
    <div class="top">
      <div class="badge">{{ operacion }}</div>
      {% if logo_url %}<img src="{{ logo_url }}" class="logo" />{% else %}<div></div>{% endif %}
    </div>
    <div class="middle">
      <div class="headline">{{ headline }}</div>
      <div class="subheadline">{{ subheadline }}</div>
    </div>
    <div class="footer">
      {% if slide_number < total_slides %}
        <div class="footer-text">Siguiente slide</div>
      {% else %}
        <div class="footer-text" style="color: var(--accent)">Escribinos ahora</div>
      {% endif %}
    </div>
  </div>
</body>
</html>
