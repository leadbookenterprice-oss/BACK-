<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Lato:wght@300;400;700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #3f2c21; --fg: #f6ede3; --accent: #c17f3a; }
  body { width: 1080px; height: 1350px; background: var(--bg); font-family: 'Lato', sans-serif; color: var(--fg); overflow: hidden; position: relative; }
  .bg-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
  .overlay { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(63,44,33,0.95) 0%, rgba(63,44,33,0.6) 40%, rgba(63,44,33,0.22) 100%); z-index: 2; }
  .content { position: absolute; inset: 0; z-index: 3; padding: 80px 72px; display: flex; flex-direction: column; justify-content: space-between; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .logo { max-width: 235px; max-height: 90px; object-fit: contain; filter: brightness(0) invert(1); }
  .badge { border: 2px solid rgba(255,255,255,0.75); color: #fff; font-size: 18px; font-weight: 700; letter-spacing: 4px; padding: 10px 18px; text-transform: uppercase; border-radius: 999px; }
  .middle { display: flex; flex-direction: column; gap: 24px; margin-bottom: 30px; }
  .headline { font-family: 'Libre Baskerville', serif; font-size: 124px; line-height: 0.9; color: var(--accent); }
  .subheadline { font-size: 42px; line-height: 1.3; color: var(--fg); max-width: 900px; }
  .footer { display: flex; justify-content: flex-end; }
  .footer-text { font-size: 21px; color: rgba(255,255,255,0.62); letter-spacing: 2px; text-transform: uppercase; }
</style>
</head>
<body>
  {% if portada_url %}<img src="{{ portada_url }}" class="bg-image" />{% endif %}
  <div class="overlay"></div>
  <div class="content">
    <div class="top">
      {% if logo_url %}<img src="{{ logo_url }}" class="logo" />{% else %}<div></div>{% endif %}
      <div class="badge">{{ operacion }}</div>
    </div>
    <div class="middle">
      <div class="headline">{{ headline }}</div>
      <div class="subheadline">{{ subheadline }}</div>
    </div>
    <div class="footer">
      {% if slide_number < total_slides %}
        <div class="footer-text">Desliza para continuar</div>
      {% else %}
        <div class="footer-text" style="color: var(--accent)">Consultanos hoy</div>
      {% endif %}
    </div>
  </div>
</body>
</html>
