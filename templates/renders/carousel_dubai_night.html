<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #080808; --fg: #f5f3ee; --accent: #c9a84c; }
  body { width: 1080px; height: 1350px; background: var(--bg); font-family: 'DM Sans', sans-serif; color: var(--fg); overflow: hidden; position: relative; }
  .bg-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
  .overlay { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(8,8,8,0.95) 0%, rgba(8,8,8,0.6) 40%, rgba(8,8,8,0.3) 100%); z-index: 2; }
  .content { position: absolute; inset: 0; z-index: 3; padding: 92px 78px; display: flex; flex-direction: column; justify-content: space-between; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .logo { max-width: 250px; max-height: 100px; object-fit: contain; filter: brightness(0) invert(1); }
  .badge { border: 1px solid rgba(201,168,76,0.65); color: var(--accent); font-family: 'Space Mono', monospace; font-size: 18px; letter-spacing: 3px; padding: 10px 18px; text-transform: uppercase; background: rgba(0,0,0,0.25); border-radius: 999px; }
  .middle { display: flex; flex-direction: column; gap: 28px; margin-bottom: 44px; }
  .headline { font-family: 'Bebas Neue', sans-serif; font-size: 152px; line-height: 0.9; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); text-shadow: 0 4px 30px rgba(0,0,0,0.45); }
  .subheadline { font-size: 46px; line-height: 1.28; color: var(--fg); max-width: 900px; }
  .footer { display: flex; justify-content: flex-end; }
  .footer-text { font-family: 'Space Mono', monospace; font-size: 22px; color: rgba(255,255,255,0.58); letter-spacing: 3px; text-transform: uppercase; }
</style>
</head>
<body>
  {% if portada_url %}<img src="{{ portada_url }}" class="bg-image" />{% endif %}
  <div class="overlay"></div>
  <div class="content">
    <div class="top">
      {% if logo_url %}<img src="{{ logo_url }}" class="logo" />{% else %}<div></div>{% endif %}
      <div class="badge">{{ operacion }}</div>
    </div>
    <div class="middle">
      <div class="headline">{{ headline }}</div>
      <div class="subheadline">{{ subheadline }}</div>
    </div>
    <div class="footer">
      {% if slide_number < total_slides %}
        <div class="footer-text">Desliza para ver mas</div>
      {% else %}
        <div class="footer-text" style="color: var(--accent)">Guardalo y escribinos</div>
      {% endif %}
    </div>
  </div>
</body>
</html>
