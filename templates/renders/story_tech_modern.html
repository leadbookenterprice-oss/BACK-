<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #081421; --fg: #e8f3ff; --accent: #00e5ff; }
  body { width: 1080px; height: 1920px; background: var(--bg); font-family: 'Space Grotesk', sans-serif; color: var(--fg); overflow: hidden; position: relative; }
  .bg-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
  .overlay { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(8,20,33,0.96) 0%, rgba(8,20,33,0.62) 42%, rgba(8,20,33,0.24) 100%); z-index: 2; }
  .accent-line { position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--accent); z-index: 6; }
  .content { position: absolute; inset: 0; z-index: 3; padding: 82px 62px 102px; display: flex; flex-direction: column; justify-content: space-between; }
  .top-section { display: flex; justify-content: space-between; align-items: center; }
  .logo { max-width: 230px; max-height: 90px; object-fit: contain; filter: brightness(0) invert(1); }
  .badge { border: 1px solid var(--accent); color: var(--accent); font-family: 'Space Mono', monospace; font-size: 22px; letter-spacing: 3px; padding: 11px 24px; text-transform: uppercase; background: rgba(0,229,255,0.08); }
  .bottom-section { display: flex; flex-direction: column; gap: 20px; }
  .title { font-family: 'Space Grotesk', sans-serif; font-size: 116px; font-weight: 700; line-height: 0.86; letter-spacing: -1px; text-transform: uppercase; }
  .title span { color: var(--accent); }
  .price-box { display: inline-block; align-self: flex-start; border: 1px solid var(--accent); border-radius: 12px; padding: 12px 20px; font-family: 'Space Mono', monospace; font-size: 36px; background: rgba(0,229,255,0.1); }
  .stats-grid { display: flex; gap: 10px; margin-top: 18px; }
  .stat-item { flex: 1; border-radius: 12px; border: 1px solid rgba(0,229,255,0.3); background: rgba(8,20,33,0.72); padding: 20px 12px; text-align: center; }
  .stat-value { font-family: 'Space Mono', monospace; font-size: 34px; color: var(--accent); line-height: 1; }
  .stat-label { font-family: 'Space Mono', monospace; font-size: 13px; letter-spacing: 2px; color: rgba(232,243,255,0.75); text-transform: uppercase; }
</style>
</head>
<body>
  <div class="accent-line"></div>
  {% if portada_url %}<img src="{{ portada_url }}" class="bg-image" />{% endif %}
  <div class="overlay"></div>
  <div class="content">
    <div class="top-section">
      <div class="badge">{{ operacion }}</div>
      {% if logo_url %}<img src="{{ logo_url }}" class="logo" />{% else %}<div></div>{% endif %}
    </div>
    <div class="bottom-section">
      <div class="title">{{ tipoPropiedad }}<br><span>{{ ciudad }}</span></div>
      <div class="price-box">{{ moneda }} {{ precio }}</div>
      {% if caracteristicas %}
      <div class="stats-grid">
        {% for stat in caracteristicas|slice:":3" %}
        <div class="stat-item">
          <div class="stat-label">{{ stat.label }}</div>
          <div class="stat-value">{{ stat.valor }}</div>
        </div>
        {% endfor %}
      </div>
      {% endif %}
    </div>
  </div>
</body>
</html>
