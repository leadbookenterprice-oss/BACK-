<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;700&display=swap');
  
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --black: #080808;
    --white: #F5F3EE;
    --accent: #C8FF00;
  }
  
  body {
    width: 1080px;
    height: 1920px;
    background: var(--black);
    font-family: 'DM Sans', sans-serif;
    color: var(--white);
    overflow: hidden;
    position: relative;
  }
  
  .bg-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
  }
  
  .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(0deg, rgba(8,8,8,0.95) 0%, rgba(8,8,8,0.7) 35%, rgba(8,8,8,0.2) 60%, rgba(8,8,8,0.4) 100%);
    z-index: 2;
  }
  
  .content {
    position: absolute;
    inset: 0;
    z-index: 3;
    padding: 100px 80px 140px 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  
  /* Top Section */
  .top-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }
  
  .logo {
    max-width: 300px;
    max-height: 140px;
    object-fit: contain;
    filter: brightness(0) invert(1);
  }
  
  .badge {
    background: var(--accent);
    color: var(--black);
    font-family: 'Space Mono', monospace;
    font-size: 36px;
    font-weight: 700;
    letter-spacing: 6px;
    padding: 20px 48px;
    text-transform: uppercase;
    border-radius: 100px;
  }
  
  /* Bottom Section */
  .bottom-section {
    display: flex;
    flex-direction: column;
    gap: 32px;
  }
  
  .title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 160px;
    line-height: 0.9;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--white);
    text-shadow: 0 4px 32px rgba(0,0,0,0.5);
  }
  
  .title span {
    color: var(--accent);
  }
  
  .price-box {
    display: inline-block;
    align-self: flex-start;
    border: 3px solid var(--white);
    padding: 24px 48px;
    font-family: 'Space Mono', monospace;
    font-size: 56px;
    font-weight: 700;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
    border-radius: 24px;
  }
  
  .stats-grid {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-top: 32px;
  }
  
  .stat-item {
    background: rgba(8,8,8,0.7);
    backdrop-filter: blur(8px);
    padding: 32px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  
  .stat-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 64px;
    color: var(--accent);
    line-height: 1;
  }
  
  .stat-label {
    font-family: 'Space Mono', monospace;
    font-size: 24px;
    color: rgba(255,255,255,0.8);
    text-transform: uppercase;
    letter-spacing: 3px;
  }
</style>
</head>
<body>
  {% if portada_url %}
    <img src="{{ portada_url }}" class="bg-image" />
  {% endif %}
  <div class="overlay"></div>
  
  <div class="content">
    <div class="top-section">
      {% if logo_url %}
        <img src="{{ logo_url }}" class="logo" />
      {% else %}
        <div></div>
      {% endif %}
      <div class="badge">{{ operacion }}</div>
    </div>
    
    <div class="bottom-section">
      <div class="title">{{ tipoPropiedad }}<br><span>{{ ciudad }}</span></div>
      <div class="price-box">{{ moneda }} {{ precio }}</div>
      
      {% if caracteristicas %}
      <div class="stats-grid">
        {% for stat in caracteristicas|slice:":3" %}
        <div class="stat-item">
          <div class="stat-label">{{ stat.label }}</div>
          <div class="stat-value">{{ stat.valor }}</div>
        </div>
        {% endfor %}
      </div>
      {% endif %}
    </div>
  </div>
</body>
</html>
