<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Lato:wght@300;400;700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #3a2a1f; --fg: #f6ede3; --accent: #c17f3a; }
  body { width: 1080px; height: 1920px; background: var(--bg); font-family: 'Lato', sans-serif; color: var(--fg); overflow: hidden; position: relative; }
  .bg-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
  .overlay { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(58,42,31,0.96) 0%, rgba(58,42,31,0.62) 40%, rgba(58,42,31,0.2) 100%); z-index: 2; }
  .content { position: absolute; inset: 0; z-index: 3; padding: 82px 64px 106px; display: flex; flex-direction: column; justify-content: space-between; }
  .top-section { display: flex; justify-content: space-between; align-items: center; }
  .logo { max-width: 220px; max-height: 88px; object-fit: contain; filter: brightness(0) invert(1); }
  .badge { border: 2px solid rgba(255,255,255,0.8); color: #fff; font-size: 22px; font-weight: 700; letter-spacing: 4px; padding: 12px 28px; text-transform: uppercase; border-radius: 999px; }
  .bottom-section { display: flex; flex-direction: column; gap: 20px; }
  .title { font-family: 'Libre Baskerville', serif; font-size: 104px; font-weight: 700; line-height: 0.9; }
  .title span { color: var(--accent); }
  .price-box { display: inline-block; align-self: flex-start; background: rgba(0,0,0,0.28); border-left: 6px solid var(--accent); padding: 12px 24px; font-family: 'Libre Baskerville', serif; font-size: 40px; font-weight: 700; }
  .stats-grid { display: flex; gap: 10px; margin-top: 20px; }
  .stat-item { flex: 1; border-radius: 12px; background: rgba(0,0,0,0.42); padding: 20px 12px; text-align: center; }
  .stat-value { font-family: 'Libre Baskerville', serif; font-size: 38px; color: var(--accent); line-height: 1; }
  .stat-label { font-size: 14px; letter-spacing: 2px; color: rgba(255,255,255,0.72); text-transform: uppercase; }
</style>
</head>
<body>
  {% if portada_url %}<img src="{{ portada_url }}" class="bg-image" />{% endif %}
  <div class="overlay"></div>
  <div class="content">
    <div class="top-section">
      {% if logo_url %}<img src="{{ logo_url }}" class="logo" />{% else %}<div></div>{% endif %}
      <div class="badge">{{ operacion }}</div>
    </div>
    <div class="bottom-section">
      <div class="title">{{ tipoPropiedad }}<br><span>{{ ciudad }}</span></div>
      <div class="price-box">{{ moneda }} {{ precio }}</div>
      {% if caracteristicas %}
      <div class="stats-grid">
        {% for stat in caracteristicas|slice:":3" %}
        <div class="stat-item">
          <div class="stat-label">{{ stat.label }}</div>
          <div class="stat-value">{{ stat.valor }}</div>
        </div>
        {% endfor %}
      </div>
      {% endif %}
    </div>
  </div>
</body>
</html>
